<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIPS-TS Demo</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
      h1 { font-size: 1.2rem; }
      section { margin-bottom: 1rem; }
      pre { background: #f5f5f5; padding: 0.5rem; max-height: 30rem; overflow: auto; font-size: 0.85rem; }
      input, button { font: inherit; padding: 0.25rem 0.5rem; }
      .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; }
      .ok { background: #d4edda; color: #155724; }
      .err { background: #f8d7da; color: #721c24; }
    </style>
  </head>
  <body>
    <h1>FIPS-TS Demo Node</h1>
    <section>
      <div>Status: <span id="status" class="pill">stopped</span></div>
      <div>Pubkey: <code id="pubkey">-</code></div>
      <div>NodeAddr: <code id="nodeaddr">-</code></div>
    </section>
    <section>
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="echo-self" disabled>Echo Self (memory transport)</button>
    </section>
    <section>
      <h2 style="font-size:1rem">Peers</h2>
      <pre id="peers">(none)</pre>
    </section>
    <section>
      <h2 style="font-size:1rem">Log</h2>
      <pre id="log"></pre>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
